<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f6f2"><meta name="sale-mode" content="false"><title>내 스팟 · Travel hub</title><link rel="stylesheet" href="spots.css?v=5"></head><body>
<div class="app"><header><a class="wordmark" href="./">travel hub<span>·</span></a><button class="avatar" aria-label="내 프로필 열기" data-profile>Y</button></header>
<main><section class="intro"><div><p class="eyebrow">MY LITTLE COLLECTION</p><h1>내가 모아둔 곳들<span>좋은 여행의 시작.</span></h1></div><button class="round-add" aria-label="장소 추가 안내" data-add>＋</button></section>
<div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="저장한 장소, 도시 검색" aria-label="저장한 장소 또는 도시 검색"><button id="clear" aria-label="검색 지우기" hidden>×</button></div>
<div class="cityline"><button id="cityPicker" class="city-picker" aria-label="여행지 선택">⌖ <span id="cityName">후쿠오카</span> ⌄</button><button id="nearby" class="nearby">◎ 내 주변</button><span class="demo">샘플 컬렉션</span></div>
<section class="album" aria-label="선택한 여행지 컬렉션"><div class="album-copy"><span class="tiny" id="albumCity">FUKUOKA, JAPAN</span><h2>다음에 꼭,<br>여기.</h2><p>가고 싶은 곳을 모아<br>나만의 하루로.</p><button class="text-button" id="browse">스팟 둘러보기 ↗</button></div><div class="polaroids" aria-hidden="true"><div class="polaroid back"><img src="assets/cafe.webp" width="424" height="640" decoding="async" alt=""><span>slow mornings</span></div><div class="polaroid front"><img src="assets/izakaya.webp" width="640" height="427" fetchpriority="high" decoding="async" alt=""><span>a little discovery</span></div></div></section>
<div class="section-heading"><h2>저장한 스팟 <span id="count">0</span></h2><button class="text-button" id="selectMode">장소 선택</button></div>
<div class="filters" role="group" aria-label="장소 유형"><button data-filter="전체" class="active" aria-pressed="true">전체</button></div>
<div id="grid" class="grid"></div><div id="empty" class="empty" hidden><h3>아직 모아둔 곳이 없어요</h3><p>다른 이름이나 유형으로 찾아보세요.</p><button class="primary" id="reset">전체 스팟 보기</button></div>
<div class="import"><div><h3>내 장소로 채워볼까요?</h3><p>구글맵에 모아둔 장소를 한곳에</p></div><button class="import-cta" data-add>가져오기 ↗</button></div>
<a class="classic" href="../index.html">기존 앱 열기 ↗</a>
</main><div class="selectionbar" id="selectionbar" hidden><span><b id="selectedCount">0</b>곳 선택</span><button class="primary" id="addRoute">오늘 동선에 담기 ↗</button></div>
<nav aria-label="하단 메뉴"><button class="nav-active" id="home"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.1 7-12A7 7 0 0 0 5 9c0 5.9 7 12 7 12Z"/><circle cx="12" cy="9" r="2.5"/></svg>내 스팟</button><button id="collection"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="15" height="16" rx="2"/><path d="M16 2H4a2 2 0 0 0-2 2v13M8 14l3-3 3 3 2-2 2 3"/></svg>사진첩</button><button id="route"><svg viewBox="0 0 24 24"><circle cx="6" cy="5" r="3"/><circle cx="18" cy="19" r="3"/><path d="M9 5h7a4 4 0 0 1 0 8H8a3 3 0 0 0 0 6h7"/></svg>오늘 동선</button><button data-profile><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></svg>프로필</button></nav></div>
<dialog id="sheet"><div class="sheet-top"><span id="sheetLabel">장소 상세</span><button id="close" aria-label="닫기">×</button></div><div id="sheetContent"></div></dialog><div class="toast" id="toast" role="status" hidden></div><script src="import-adapter.js?v=1"></script><script src="spots.js?v=1"></script></body></html>
